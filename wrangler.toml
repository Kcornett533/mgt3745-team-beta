# wrangler.toml
# Tells wrangler what to deploy and what the Worker is allowed to reach.
# Nothing in this file is secret. The database_id is an address, not a key.

name = "team-beta-screening"
main = "worker.js"
compatibility_date = "2026-10-29"

# Static pages (index.html, app.js, styles.css) are served from public/ on the
# same origin as the API, so the browser needs no CORS allowance.
[assets]
directory = "./public"

# The D1 binding. The Worker sees this database as env.DB.
[[d1_databases]]
binding = "DB"
database_name = "mgt3745-dev"
database_id = "498b72f2-22a4-47c2-a89d-53416a39616a"
